<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">🎓 Smart College Management</span>
    <a href="/logout" class="btn btn-danger">Logout</a>
</nav>

<div class="container mt-5">

    <div class="text-center mb-5">
        <h2>Welcome to Admin Dashboard 👋</h2>
        <p class="text-muted">Manage college activities easily</p>
    </div>

    <div class="row g-4">

        <!-- Students Card -->
        <div class="col-md-4">
            <div class="card shadow-lg border-0 text-center p-4">
                <h4>👨‍🎓 Students</h4>
                <h2 class="text-primary">{{ total_students }}</h2>
                <p class="text-muted">Total Students</p>

            </div>
        </div>

        <!-- Faculty Card -->
        <div class="col-md-4">
            <div class="card shadow-lg border-0 text-center p-4">
                <h4>👩‍🏫 Faculty</h4>
                <p class="text-muted">Coming Soon</p>
                <button class="btn btn-secondary" disabled>Manage Faculty</button>
            </div>
        </div>

        <!-- Attendance Card -->
        <div class="col-md-4">
            <div class="card shadow-lg border-0 text-center p-4">
                <h4>📊 Attendance</h4>
                <p class="text-muted">Coming Soon</p>
                <button class="btn btn-secondary" disabled>Track Attendance</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
