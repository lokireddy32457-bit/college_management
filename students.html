<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🎓 Student Management</h2>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <!-- Add Student Form -->
    <div class="card p-4 mb-4 shadow-sm">
        <h5 class="mb-3">Add New Student</h5>
        <form method="POST" class="row g-3">
            <div class="col-md-3">
                <input type="text" name="name" class="form-control" placeholder="Name" required>
            </div>
            <div class="col-md-2">
                <input type="text" name="rollno" class="form-control" placeholder="Roll No" required>
            </div>
            <div class="col-md-3">
                <input type="text" name="branch" class="form-control" placeholder="Branch" required>
            </div>
            <div class="col-md-2">
                <input type="text" name="year" class="form-control" placeholder="Year" required>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100">Add</button>
            </div>
        </form>
    </div>

    <!-- Students Table -->
    <div class="card p-4 shadow-sm">
        <h5 class="mb-3">All Students</h5>
        <form method="GET" class="mb-3">
    <div class="input-group">
        <input type="text" name="search" class="form-control"
               placeholder="Search by Name or Roll No">
        <button class="btn btn-outline-primary">Search</button>
    </div>
</form>

        

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Branch</th>
                    <th>Year</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s[0] }}</td>
                    <td>{{ s[1] }}</td>
                    <td>{{ s[2] }}</td>
                    <td>{{ s[3] }}</td>
                    <td>{{ s[4] }}</td>
                    <td class="text-center">
                        <a href="/edit/{{ s[0] }}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="/delete/{{ s[0] }}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
