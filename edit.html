<!DOCTYPE html>
<html>
<head>
	<title>Edit Student</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">
<div class="container mt-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2>Edit Student</h2>
		<a href="/students" class="btn btn-secondary">Back</a>
	</div>

	<div class="card p-4 shadow-sm">
		<form method="POST" class="row g-3">
			<div class="col-md-6">
				<input type="text" name="name" class="form-control" value="{{student[1]}}" required>
			</div>
			<div class="col-md-6">
				<input type="text" name="rollno" class="form-control" value="{{student[2]}}" required>
			</div>
			<div class="col-md-6">
				<input type="text" name="branch" class="form-control" value="{{student[3]}}" required>
			</div>
			<div class="col-md-6">
				<input type="text" name="year" class="form-control" value="{{student[4]}}" required>
			</div>
			<div class="col-12">
				<button class="btn btn-primary">Update</button>
			</div>
		</form>
	</div>
</div>
</body>
</html>
